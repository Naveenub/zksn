[package]
name        = "zksn-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZKSN client library and CLI"

[lib]
name       = "zksn_client"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zksn"
path = "cli/main.rs"

[features]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]

[dependencies]
zksn-crypto   = { path = "../crypto" }
zksn-economic = { path = "../economic" }
zksn-node     = { path = "../node" }

tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
bincode            = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
rand               = { workspace = true }
sha2               = { workspace = true }
x25519-dalek       = { workspace = true }
zeroize            = { workspace = true }
hex                = { workspace = true }
clap               = { version = "4",   features = ["derive"] }
colored            = "2"
indicatif          = "0.17"

# Python bindings — only compiled with `--features python` (e.g. via maturin).
# The `zksn` CLI binary never touches these, so its normal build is unaffected.
pyo3                 = { version = "0.23", features = ["extension-module"], optional = true }
pyo3-async-runtimes  = { version = "0.23", features = ["tokio-runtime"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile   = "3"
